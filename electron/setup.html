<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Pi Web - Setup</title>
  <style>
    :root {
      --bg: #1d2021;
      --bg-panel: #282828;
      --bg-input: #3c3836;
      --border: #665c54;
      --text: #ebdbb2;
      --text-muted: #a89984;
      --accent: #83a598;
      --accent-hover: #8ec07c;
      --error: #fb4934;
      --success: #b8bb26;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      -webkit-app-region: drag;
    }
    .container {
      width: 100%;
      max-width: 400px;
      -webkit-app-region: no-drag;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .logo p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text);
      font-size: 14px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(131, 165, 152, 0.18);
    }
    .form-group input::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }
    .form-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .form-hint.error {
      color: var(--error);
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      color: #1d2021;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled {
      background: #504945;
      color: #7c6f64;
      cursor: not-allowed;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .status {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      min-height: 20px;
    }
    .status.error { color: var(--error); }
    .status.success { color: var(--success); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>π Web</h1>
      <p>Desktop Setup</p>
    </div>

    <div class="form-group">
      <label for="password">访问密码</label>
      <input type="password" id="password" placeholder="设置访问密码（必填）" autofocus>
      <div class="form-hint">用于 Basic Auth 保护外网访问</div>
    </div>

    <div class="form-group">
      <label for="allowedHosts">允许域名</label>
      <input type="text" id="allowedHosts" placeholder="例如 piweb.274747.xyz">
      <div class="form-hint">多个域名用逗号分隔，留空允许所有</div>
    </div>

    <div class="divider">高级</div>

    <div class="form-group">
      <label for="port">本地端口</label>
      <input type="number" id="port" placeholder="30141" value="30141">
      <div class="form-hint" id="port-hint">默认 30141</div>
    </div>

    <button class="btn btn-primary" id="start-btn" disabled>启动 Pi Web</button>

    <div class="status" id="status"></div>
  </div>

  <script>
    const passwordEl = document.getElementById("password");
    const allowedHostsEl = document.getElementById("allowedHosts");
    const portEl = document.getElementById("port");
    const startBtn = document.getElementById("start-btn");
    const statusEl = document.getElementById("status");
    const portHintEl = document.getElementById("port-hint");

    let isPortFree = true;

    function checkForm() {
      startBtn.disabled = !passwordEl.value.trim() || !isPortFree;
    }

    passwordEl.addEventListener("input", checkForm);
    allowedHostsEl.addEventListener("input", checkForm);

    portEl.addEventListener("input", async () => {
      const port = parseInt(portEl.value, 10);
      if (!port || port < 1 || port > 65535) {
        portHintEl.textContent = "端口范围 1-65535";
        portHintEl.classList.add("error");
        isPortFree = false;
        checkForm();
        return;
      }
      portHintEl.classList.remove("error");
      portHintEl.textContent = "检查中…";
      try {
        const result = await window.piDesktop.checkPort(port);
        isPortFree = result.free;
        portHintEl.textContent = result.free
          ? `端口 ${port} 可用`
          : `端口 ${port} 已被占用`;
        if (!result.free) portHintEl.classList.add("error");
      } catch {
        isPortFree = true;
        portHintEl.textContent = `默认 ${port}`;
      }
      portHintEl.classList.toggle("error", !isPortFree);
      checkForm();
    });

    // Load existing config
    window.piDesktop.onLoadConfig((config) => {
      if (config) {
        if (config.password) passwordEl.value = config.password;
        if (config.allowedHosts) allowedHostsEl.value = config.allowedHosts;
        if (config.port) {
          portEl.value = config.port;
          portEl.dispatchEvent(new Event("input"));
        }
        checkForm();
      }
    });

    startBtn.addEventListener("click", async () => {
      const config = {
        password: passwordEl.value.trim(),
        allowedHosts: allowedHostsEl.value.trim(),
        port: parseInt(portEl.value, 10) || 30141,
        hostname: "0.0.0.0",
      };

      startBtn.disabled = true;
      startBtn.textContent = "正在启动…";
      statusEl.textContent = "";
      statusEl.className = "status";

      try {
        const result = await window.piDesktop.saveAndStart(config);
        if (!result.success) {
          statusEl.textContent = "启动失败: " + (result.error || "未知错误");
          statusEl.className = "status error";
          startBtn.disabled = false;
          startBtn.textContent = "启动 Pi Web";
        }
        // On success, window will close automatically
      } catch (err) {
        statusEl.textContent = "启动失败: " + err.message;
        statusEl.className = "status error";
        startBtn.disabled = false;
        startBtn.textContent = "启动 Pi Web";
      }
    });
  </script>
</body>
</html>
