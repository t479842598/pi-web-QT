<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pi Web</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* 启动等待页：打开即用（F-01/D-03）。复用 style.css 的 :root 变量，
       只补这一页独有的居中布局与进度动画，不新增构建步骤。 */
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .startup {
      width: min(460px, 92vw);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      user-select: none;
    }
    /* 无边框窗口（Windows/Linux）下这块区域承担窗口拖动 */
    .startup-head { -webkit-app-region: drag; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .startup .logo { width: 56px; height: 56px; font-size: 30px; }
    .startup h1 { font-size: 17px; margin: 0; color: var(--text); font-weight: 600; }
    .startup .stage { font-size: 13px; color: var(--muted); line-height: 1.6; min-height: 20px; }
    .dots { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
    .dots i {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); opacity: 0.25;
      animation: blink 1.2s infinite ease-in-out;
    }
    .dots i:nth-child(2) { animation-delay: 0.2s; }
    .dots i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    .startup .card { text-align: left; width: 100%; }
    .startup-actions { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    .startup .hint { display: block; margin-top: 8px; }
    .startup-foot { font-size: 11.5px; color: var(--dim); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="startup">
    <div class="startup-head">
      <div class="logo">π</div>
      <h1>Pi Web</h1>
    </div>

    <div id="progress">
      <div class="stage">正在启动本机 Pi Web 服务<span class="dots"><i></i><i></i><i></i></span></div>
      <div class="stage" id="elapsed" style="color: var(--dim); font-size: 12px;"></div>
    </div>

    <!-- 启动失败兜底：由 Rust 侧 window.__piwebStartupFailed(reason) 打开 -->
    <section class="card" id="failed" hidden>
      <div class="card-head"><h2>本机服务未能启动</h2></div>
      <p class="desc" id="failed-reason">未能在超时时间内连上本机服务。</p>
      <div class="startup-actions">
        <button id="btn-retry" class="primary">重试启动</button>
        <button id="btn-connect" class="ghost">连接其他服务器</button>
      </div>
      <span id="retry-hint" class="hint"></span>
    </section>

    <div class="startup-foot">首次启动需要几秒；你的会话与模型配置会自动读取，无需设置。</div>
  </div>

  <script>
    (function () {
      var invoke = window.__TAURI__ && window.__TAURI__.core
        ? window.__TAURI__.core.invoke
        : null;

      var progress = document.getElementById('progress');
      var failed = document.getElementById('failed');
      var reasonEl = document.getElementById('failed-reason');
      var elapsedEl = document.getElementById('elapsed');
      var retryHint = document.getElementById('retry-hint');
      var startedAt = Date.now();

      // 让用户知道「还在动」而不是卡死：每 2s 更新一次已等待时长
      setInterval(function () {
        var sec = Math.round((Date.now() - startedAt) / 1000);
        if (sec >= 2) elapsedEl.textContent = '已等待 ' + sec + ' 秒';
      }, 1000);

      /** 由壳在拉起失败/超时时调用（见 desktop/src/window.rs notify_startup_failed） */
      window.__piwebStartupFailed = function (reason) {
        reasonEl.textContent = String(reason || '未知错误');
        progress.hidden = true;
        failed.hidden = false;
      };

      /** 就绪时壳会直接 navigate 本窗口，这里只做视觉收尾（可选） */
      window.__piwebStartupReady = function () {
        failed.hidden = true;
        progress.hidden = false;
      };

      document.getElementById('btn-retry').addEventListener('click', function () {
        if (!invoke) { window.location.reload(); return; }
        var btn = this;
        btn.disabled = true;
        btn.textContent = '正在重试…';
        retryHint.textContent = '';
        failed.hidden = true;
        progress.hidden = false;
        startedAt = Date.now();
        invoke('retry_startup').catch(function (e) {
          retryHint.textContent = String(e).replace(/^Error:\s*/, '');
          failed.hidden = false;
          progress.hidden = true;
        }).finally(function () {
          btn.disabled = false;
          btn.textContent = '重试启动';
        });
      });

      document.getElementById('btn-connect').addEventListener('click', function () {
        if (invoke) invoke('open_connect').catch(function () {});
      });
    })();
  </script>
</body>
</html>
