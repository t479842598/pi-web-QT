<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pi Web — 连接管理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">π</div>
        <div>
          <h1>Pi Web 桌面端</h1>
          <p class="sub">连接本机或远程 Pi Web，多端数据自动同步</p>
        </div>
      </div>
      <div class="actions">
        <button id="btn-update" class="ghost" title="检查更新">检查更新</button>
        <button id="btn-quit" class="ghost danger" title="退出应用">退出</button>
      </div>
    </header>

    <main>
      <!-- 首次启动 · 设置本机密码（本地未设置密码时显示；设置后隐藏） -->
      <section class="card setup-card" id="setup-card" hidden>
        <div class="card-head">
          <h2 id="setup-title">首次启动 · 设置本机密码</h2>
          <span class="badge warn">需设置</span>
        </div>
        <p class="desc">本机 Pi Web 服务默认对局域网开放，需设置访问密码保护。设置后将自动启动并连接本机服务，此后每次启动免密连接。</p>
        <div class="field">
          <label for="inp-setup-pass">设置密码（至少 6 位）</label>
          <input id="inp-setup-pass" type="password" placeholder="用于本机 Pi Web 访问" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="inp-setup-pass2">确认密码</label>
          <input id="inp-setup-pass2" type="password" placeholder="再次输入确认" autocomplete="new-password" />
        </div>
        <div class="form-foot">
          <button id="btn-setup-clear" class="ghost danger" hidden>清除本机密码</button>
          <span id="setup-hint" class="hint"></span>
          <button id="btn-setup" class="primary">设置并启动本机</button>
        </div>
      </section>

      <!-- 本地状态 -->
      <section class="card local-card">
        <div class="card-head">
          <h2>本机运行环境</h2>
          <span id="local-badge" class="badge probing">检测中…</span>
        </div>
        <p id="local-desc" class="desc">正在探测本机 Pi Web 服务…</p>
        <div class="local-actions">
          <button id="btn-start-local" class="primary" disabled>
            <span class="dot"></span>启动本机 Pi Web
          </button>
          <button id="btn-change-local-pass" class="ghost mini" hidden title="修改或清除本机访问密码">修改本机密码</button>
          <button id="btn-stop-local" class="ghost mini" disabled title="停止本机 Pi Web 服务（含外部启动的进程）">关闭本机服务</button>
        </div>
        <div class="field local-domain-field">
          <label for="inp-local-domain">可信域名（Cloudflare 隧道等外部访问，可选）</label>
          <div class="url-row">
            <input id="inp-local-domain" type="text" placeholder="piweb.274747.xyz" autocomplete="off" />
            <button type="button" id="btn-save-domain" class="ghost mini" title="保存可信域名并重启本机服务生效">保存</button>
          </div>
          <p id="domain-hint" class="hint"></p>
        </div>
      </section>

      <!-- 添加服务器 -->
      <section class="card">
        <div class="card-head"><h2>添加 / 连接服务器</h2></div>
        <form id="form-server" autocomplete="off">
          <div class="field">
            <label for="inp-name">名称（可选）</label>
            <input id="inp-name" type="text" placeholder="例如：云端 / 办公网" />
          </div>
          <div class="field">
            <label for="inp-url">服务器地址</label>
            <div class="url-row">
              <input id="inp-url" type="text" placeholder="http://127.0.0.1:30141 或 https://pi.example.com" required />
              <button type="button" id="btn-get-local" class="ghost mini" title="自动探测本机运行的 Pi Web 服务并填入地址">获取本机链接</button>
            </div>
          </div>
          <div class="field">
            <label for="inp-user">用户名（默认 pi）</label>
            <input id="inp-user" type="text" value="pi" placeholder="pi" autocomplete="username" />
          </div>
          <div class="field">
            <label for="inp-pass">密码（本机/服务器密码，输入一次保存，之后免输入）</label>
            <input id="inp-pass" type="password" placeholder="PI_WEB_PASSWORD" autocomplete="new-password" />
          </div>
          <div class="form-foot">
            <span id="form-hint" class="hint"></span>
            <button type="submit" class="primary">连接</button>
          </div>
        </form>
      </section>

      <!-- 服务器列表 -->
      <section class="card">
        <div class="card-head"><h2>已保存的服务器</h2><span id="list-count" class="count"></span></div>
        <ul id="server-list" class="server-list"></ul>
        <p id="list-empty" class="empty">还没有保存的服务器</p>
      </section>
    </main>

    <footer class="foot">
      <span id="foot-version">Pi Web Desktop</span>
      <span class="sep">·</span>
      <span>用户名/密码仅保存在本机配置中，输入一次后免密连接</span>
    </footer>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
