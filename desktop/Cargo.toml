[package]
name = "pi-web-desktop"
version = "0.10.8"
description = "Pi Web 桌面端（Tauri 2 瘦壳）：自动连接本机或远程 Pi Web 服务"
authors = ["pi-web"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pi_web_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
url = "2"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "system-proxy"] }
tokio = { version = "1", features = ["net"] }
wait-timeout = "0.2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tiny_http = "0.12"

[features]
default = []
# 发布打包时启用（需 tauri.conf.json 配好 updater.pubkey，且 CI 注入 TAURI_SIGNING_PRIVATE_KEY）
updater = ["dep:tauri-plugin-updater"]

[profile.release]
strip = true
lto = true
codegen-units = 1
