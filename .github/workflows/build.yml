name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Explicit permissions: release job creates a GitHub Release and build job
# uploads artifacts. Without 'contents: write', tag-triggered workflows get a
# read-only GITHUB_TOKEN and softprops/action-gh-release fails with 403.
permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            artifact: '*.dmg'
          - os: windows-latest
            target: win
            artifact: '*.exe'
          - os: ubuntu-latest
            target: linux
            artifact: '*.AppImage'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Prepare clean CI home (Windows junction workaround)
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.ci-home"

      # Windows junction directories (C:\Users\runneradmin\Cookies etc.) are
      # unreadable (EPERM) and break next build's outputFileTracing when it
      # follows os.homedir(). Point home at a clean dir inside the repo so the
      # trace never scans the real Windows user profile. Other OSes build with
      # their normal home.
      - name: Build Next.js (Windows)
        if: runner.os == 'Windows'
        run: npm run build
        env:
          USERPROFILE: ${{ github.workspace }}/.ci-home
          HOME: ${{ github.workspace }}/.ci-home

      - name: Build Next.js (macOS/Linux)
        if: runner.os != 'Windows'
        run: npm run build

      - name: Build Electron (${{ matrix.target }})
        # --publish never: the release job (softprops/action-gh-release) owns
        # release creation. electron-builder would otherwise try to publish to
        # GitHub Releases itself when a tag is present.
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: pi-web-${{ matrix.target }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-web-*
          merge-multiple: true
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          # generate_release_notes requires a PAT (the generate-notes API is
          # not available to the auto GITHUB_TOKEN) — keep it off so releases
          # can be created with the default token.
          generate_release_notes: false
