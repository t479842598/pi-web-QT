name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job used to be continue-on-error because fork-specific UI differences
    # (the pagination "scroll to load" sentinel) made it red, which meant every
    # run since 2026-10-17 reported success while e2e was in fact failing — a
    # masked job is worse than no job, because it looks green.
    #
    # The fork differences are adapted now, and each remaining non-run is a
    # capability gate that prints SKIP with its reason (extension dialogs need a
    # provider credential; the chat-appearance controls no longer exist in the
    # product). Keeping the job blocking means a real regression here cannot
    # hide behind a green run again. e2e-failure is uploaded on failure.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_SERVER_MODE: start
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: test-results/e2e/
          retention-days: 7
