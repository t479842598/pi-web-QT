name: mobile-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build the Flutter client in mobile/ and attach Android APK/AAB + iOS unsigned
# IPA to the GitHub release for the pushed tag (or a draft release when
# triggered manually). The version is derived from the tag so it stays
# independent of the web version (v1.2.0 -> 1.2.0+<build>).
#
# Secrets required for Android release signing:
#   ANDROID_KEYSTORE_BASE64  - base64 of the release keystore (.jks)
#   KEYSTORE_PASSWORD        - store password
#   KEY_PASSWORD             - key password
#   KEY_ALIAS                - key alias
# iOS intentionally builds unsigned (sideload via AltStore / Sideloadly), so no
# Apple certificate secrets are needed.

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="${GITHUB_REF_NAME#v}"
            BUILD="${GITHUB_RUN_NUMBER}"
          else
            # Manual dispatch: keep the version in pubspec.yaml and use the
            # current run number as the build suffix.
            VER="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
            BUILD="${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          sed -i "s/^version: .*/version: ${VER}+${BUILD}/" pubspec.yaml
          echo "Resolved mobile version: ${VER}+${BUILD}"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.jks"
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=${{ runner.temp }}/release.jks
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER="${GITHUB_REF_NAME#v}"
            BUILD="${GITHUB_RUN_NUMBER}"
          else
            VER="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
            BUILD="${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          # macOS runner uses BSD sed, which requires the -i backup suffix.
          sed -i.bak "s/^version: .*/version: ${VER}+${BUILD}/" pubspec.yaml && rm -f pubspec.yaml.bak
          echo "Resolved mobile version: ${VER}+${BUILD}"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            build/ios/ipa/*.ipa

  release:
    name: Attach assets to GitHub release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Find version
        id: version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/*.ipa
          fail_on_unmatched_files: false
