<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Pi Web 远程</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/theme.css" />
</head>
<body>
  <!-- Lucide icon sprite: the same set ZCode's remote shell uses, as symbols so
       each use is one <svg><use href="#icon-x"></svg> instead of repeated paths. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-chevrons-down-up" viewBox="0 0 24 24"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></symbol>
      <symbol id="i-chevrons-up-down" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></symbol>
      <symbol id="i-rotate-cw" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
      <symbol id="i-panel-right" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></symbol>
      <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></symbol>
      <symbol id="i-loader" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></symbol>
      <symbol id="i-bot" viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></symbol>
      <symbol id="i-message-square" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- Home: projects and their sessions, mirroring ZCode's remote shell. -->
    <section id="view-home" class="view">
      <header class="bar">
        <div class="bar-title">
          <div class="bar-main" id="home-title">Pi Web 远程</div>
          <div class="bar-sub" id="home-status">正在连接…</div>
        </div>
        <div class="bar-actions">
          <span class="theme-menu-slot" id="home-theme"></span>
        </div>
      </header>
      <div class="search-bar">
        <span class="search-icon"><svg class="icon"><use href="#i-search"/></svg></span>
        <input id="home-search" type="search" placeholder="搜索会话或项目…" autocomplete="off" />
      </div>
      <div class="scroll" id="home-scroll">
        <div id="home-body"></div>
        <!-- Bot Channel exists in ZCode's remote shell but has no pi-web
             equivalent yet; shown disabled so the feature set stays legible. -->
        <div class="bot-channel" aria-disabled="true">
          <div class="bot-channel-title">使用 Bot Channel<span class="badge">未接入</span></div>
          <p class="bot-channel-desc">连接聊天 Bot，适合更长时间的移动端访问（微信 / 飞书 / Lark / Telegram）。pi-web 尚未实现该通道。</p>
        </div>
      </div>
    </section>

    <!-- Chat: one session. -->
    <section id="view-chat" class="view hidden">
      <header class="bar">
        <button type="button" class="icon-btn" id="chat-back" title="返回任务首页" aria-label="返回任务首页">
          <svg class="icon"><use href="#i-arrow-left"/></svg>
        </button>
        <div class="bar-title">
          <div class="bar-main" id="chat-title">任务会话</div>
          <div class="bar-sub" id="chat-status"></div>
        </div>
        <div class="bar-actions">
          <button type="button" class="icon-btn" id="chat-view-toggle" aria-label="切换显示模式" title="切换显示模式">
            <svg class="icon"><use href="#i-sliders"/></svg>
          </button>
          <button type="button" class="icon-btn" id="chat-pane-toggle" aria-label="会话信息与标签页" title="会话信息与标签页">
            <svg class="icon"><use href="#i-panel-right"/></svg>
          </button>
          <button type="button" class="icon-btn" id="chat-web" aria-label="打开完整界面" title="打开完整界面">
            <svg class="icon"><use href="#i-maximize"/></svg>
          </button>
        </div>
      </header>
      <div class="chat-body">
        <main class="chat-main" id="chat-main">
          <div class="scroll" id="chat-scroll">
            <div class="messages" id="chat-messages"></div>
          </div>
          <div class="composer">
            <div class="composer-row" id="chat-model-row"></div>
            <div class="composer-inner">
              <textarea id="chat-input" rows="1" placeholder="发消息…" autocomplete="off"></textarea>
              <button type="button" class="btn btn-primary" id="chat-send">发送</button>
            </div>
          </div>
        </main>

        <!-- Slide-in side pane (session info / tabs), like ZCode's mobile pane. -->
        <div class="pane-overlay hidden" id="pane-overlay" aria-hidden="true">
          <button type="button" class="pane-backdrop" id="pane-backdrop" aria-label="收起侧栏"></button>
          <aside class="pane" id="pane">
            <header class="pane-head">
              <span id="pane-title">会话信息</span>
              <button type="button" class="icon-btn" id="pane-close" aria-label="收起侧栏">
                <svg class="icon"><use href="#i-x"/></svg>
              </button>
            </header>
            <div class="pane-body" id="pane-body"></div>
          </aside>
        </div>

        <div class="reconnect-toast hidden" id="reconnect-toast" aria-live="polite">
          <svg class="icon spin"><use href="#i-loader"/></svg><span>正在自动重连…</span>
        </div>
        <div class="loading-overlay hidden" id="loading-overlay" aria-busy="true">
          <div class="loading-card">
            <svg class="icon spin"><use href="#i-loader"/></svg><span>加载中…</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Status / error states. -->
    <section id="view-status" class="view hidden">
      <header class="bar">
        <div class="bar-title"><div class="bar-main" id="status-title">Pi Web 远程</div></div>
      </header>
      <div class="scroll">
        <div class="error-box hidden" id="status-error"></div>
        <p class="status-line" id="status-detail"></p>
        <button type="button" class="btn" id="status-retry">重试</button>
      </div>
    </section>
  </div>

  <script type="module" src="/remote.js"></script>
</body>
</html>
